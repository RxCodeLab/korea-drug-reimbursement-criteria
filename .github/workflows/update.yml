name: Update drug criteria

on:
  workflow_dispatch:
    inputs:
      law_changes_since:
        description: 법제처 고시를 이 시행일자(YYYYMMDD)부터 다시 내려받고 검증 (비우면 증분)
        required: false
        default: ""
      mfds_changes_since:
        description: 의약품 허가정보 변경분을 이 날짜(YYYYMMDD)부터 다시 조회 (비우면 증분)
        required: false
        default: ""
  schedule:
    - cron: "17 20 * * *"

concurrency:
  group: drug-criteria-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      law_fetch: ${{ steps.fetch_law.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore raw upstream archive
        uses: actions/cache/restore@v6
        with:
          path: data/raw
          key: raw-linux-${{ github.run_id }}
          restore-keys: |
            raw-linux-
      - name: Install rhwp
        shell: bash
        run: |
          archive="$RUNNER_TEMP/rhwp-v0.8.4-linux-x86_64.tar.gz"
          bin_dir="$RUNNER_TEMP/rhwp-bin"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/edwardkim/rhwp/releases/download/v0.8.4/rhwp-v0.8.4-linux-x86_64.tar.gz
          echo "d2f015447147a840b3a587e8e9bedd75973fb2e0a60eac37b08cad9e34cdac54  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -D -m 0755 "$RUNNER_TEMP/rhwp/rhwp" "$bin_dir/rhwp"
          echo "$bin_dir" >> "$GITHUB_PATH"
          export PATH="$bin_dir:$PATH"
          rhwp --version
          rhwp capabilities > "$RUNNER_TEMP/rhwp-capabilities.json"
          python -c "import json; json.load(open('$RUNNER_TEMP/rhwp-capabilities.json'))"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      # 법제처 장애(해외 IP 시간대 제한 등) 시에도 뒤 단계를 막지 않는다.
      # 급여기준 신규분만 다음 성공 런으로 미뤄지고, 불완전 자료는 ingest/verify가 걸러낸다.
      - name: Fetch and validate upstream archive
        id: fetch_law
        continue-on-error: true
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          LAW_CHANGES_SINCE: ${{ inputs.law_changes_since }}
        run: |
          test -n "$LAW_OC" || { echo "LAW_OC repository secret is required"; exit 1; }
          law_changes_since="${LAW_CHANGES_SINCE}"
          if [ -n "$law_changes_since" ]; then
            python fetch_law.py --changes-since "$law_changes_since"
          else
            python fetch_law.py
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          secret = os.environ["LAW_OC"]
          for path in [Path("data/versions.json"), *Path("data/raw").glob("*/meta.json")]:
              if secret in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"LAW_OC leaked into {path}")
          PY
      - name: Fetch MFDS permit data
        env:
          DATA_GO_KEY: ${{ secrets.DATA_GO_KEY }}
          MFDS_CHANGES_SINCE: ${{ inputs.mfds_changes_since }}
        run: |
          mfds_changes_since="${MFDS_CHANGES_SINCE}"
          if [ -n "$mfds_changes_since" ]; then
            python fetch_mfds.py --changes-since "$mfds_changes_since"
          else
            python fetch_mfds.py
          fi
      - name: Normalize and build SQLite
        run: python ingest.py
      - name: Verify candidate publication
        run: python verify.py
      - name: Build static search
        run: python build_site.py
      - name: Save raw upstream archive
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: data/raw
          key: raw-linux-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        with:
          name: publication-candidate
          path: |
            data/raw
            data/normalized
            data/versions.json
            data/criteria.db
            data/mfds
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  publish-data:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: publication-candidate
          path: candidate
      - name: Promote canonical data and commit
        id: commit
        shell: bash
        run: |
          mkdir -p data/raw data/normalized data/mfds
          cp -a candidate/raw/. data/raw/
          cp -a candidate/normalized/. data/normalized/
          if [ -d candidate/mfds ]; then cp -a candidate/mfds/. data/mfds/; fi
          cp candidate/versions.json data/versions.json
          git add data/normalized
          if [ -d data/mfds/items ]; then git add data/mfds; fi
          git add -f data/versions.json data/raw/*/meta.json data/raw/*/[0-9][0-9][0-9]_*
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "RxCodeLab"
          git config user.email "40620480+RxCodeLab@users.noreply.github.com"
          git commit -m "급여기준 데이터 갱신"
          git push
          tag="data-${GITHUB_RUN_ID}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish downloadable SQLite snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.commit.outputs.tag }}
        run: |
          sha256sum candidate/criteria.db > candidate/criteria.db.sha256
          gh release create "$TAG" candidate/criteria.db candidate/criteria.db.sha256 --target "$(git rev-parse HEAD)" --title "$TAG" --notes "Verified automated drug-criteria snapshot."

  report-upstream:
    needs: build
    if: needs.build.outputs.law_fetch == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Mark upstream fetch failure
        run: |
          echo "::error::법제처 수집이 실패해 기존 자료로 진행했습니다. 급여기준 신규분은 반영되지 않았습니다."
          exit 1

  deploy-pages:
    needs: [build, publish-data]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified static search
        id: deployment
        uses: actions/deploy-pages@v5
