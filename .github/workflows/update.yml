name: Update drug criteria

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update.yml
      - "*.py"
      - requirements.txt
      - tests/**
  workflow_dispatch:
    inputs:
      law_changes_since:
        description: 법제처 고시를 이 시행일자(YYYYMMDD)부터 다시 내려받고 검증 (비우면 증분)
        required: false
        default: ""
      mfds_changes_since:
        description: 의약품 허가정보 변경분을 이 날짜(YYYYMMDD)부터 다시 조회 (비우면 증분)
        required: false
        default: ""
      full_sweep:
        description: "의약품 허가정보를 토요일처럼 조건 없이 전량 열거 후 로컬 매칭 (기본: 증분)"
        required: false
        default: false
        type: boolean
  schedule:
    # 21:23 KST(UTC+9) = 12:23 UTC 같은 날짜. 정각(:00)은 GitHub Actions 큐 지연이 커서 피한다.
    # 평일 저녁: 월~금 증분 (`python fetch_mfds.py`).
    - cron: "23 12 * * 1-5"
    # 토요일 저녁: 전량 열거 (`python fetch_mfds.py --full`). 일요일은 실행하지 않는다.
    - cron: "23 12 * * 6"

concurrency:
  group: drug-criteria-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      law_fetch: ${{ steps.fetch_law.outcome }}
      mfds_fetch: ${{ steps.fetch_mfds.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install rhwp
        shell: bash
        run: |
          archive="$RUNNER_TEMP/rhwp-v0.8.4-linux-x86_64.tar.gz"
          bin_dir="$RUNNER_TEMP/rhwp-bin"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/edwardkim/rhwp/releases/download/v0.8.4/rhwp-v0.8.4-linux-x86_64.tar.gz
          echo "d2f015447147a840b3a587e8e9bedd75973fb2e0a60eac37b08cad9e34cdac54  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -D -m 0755 "$RUNNER_TEMP/rhwp/rhwp" "$bin_dir/rhwp"
          echo "$bin_dir" >> "$GITHUB_PATH"
          export PATH="$bin_dir:$PATH"
          rhwp --version
          rhwp capabilities > "$RUNNER_TEMP/rhwp-capabilities.json"
          python -c "import json; json.load(open('$RUNNER_TEMP/rhwp-capabilities.json'))"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest pyyaml
      # 파서·검증 회귀는 수집 전에 잡는다. 테스트가 깨지면 이 실행은 게시하지 않는다.
      - name: Run tests
        env:
          RHWP_BIN: rhwp
        run: python -m pytest -q
      # 법제처 장애(해외 IP 시간대 제한 등) 시에도 뒤 단계를 막지 않는다.
      # 급여기준 신규분만 다음 성공 런으로 미뤄지고, 불완전 자료는 ingest/verify가 걸러낸다.
      # 실패는 report-upstream job이 issue로 알린다.
      - name: Fetch law notices
        id: fetch_law
        continue-on-error: true
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          LAW_CHANGES_SINCE: ${{ inputs.law_changes_since }}
        run: |
          test -n "$LAW_OC" || { echo "LAW_OC repository secret is required"; exit 1; }
          law_changes_since="${LAW_CHANGES_SINCE}"
          if [ -n "$law_changes_since" ]; then
            python fetch_law.py --changes-since "$law_changes_since"
          else
            python fetch_law.py
          fi
      - name: Fetch MFDS permit data
        id: fetch_mfds
        continue-on-error: true
        env:
          DATA_GO_KEY: ${{ secrets.DATA_GO_KEY }}
          MFDS_CHANGES_SINCE: ${{ inputs.mfds_changes_since }}
          # 토요일 cron만 전량 열거. workflow_dispatch는 full_sweep 입력으로 선택. push/평일 cron은 증분.
          MFDS_FULL_SWEEP: ${{ github.event.schedule == '23 12 * * 6' || inputs.full_sweep }}
        run: |
          test -n "$DATA_GO_KEY" || { echo "DATA_GO_KEY repository secret is required"; exit 1; }
          mfds_changes_since="${MFDS_CHANGES_SINCE}"
          if [ "$MFDS_FULL_SWEEP" = "true" ]; then
            # --full과 --changes-since는 함께 쓸 수 없다(fetch_mfds.py가 거부).
            python fetch_mfds.py --full
          elif [ -n "$mfds_changes_since" ]; then
            python fetch_mfds.py --changes-since "$mfds_changes_since"
          else
            python fetch_mfds.py
          fi
      - name: Normalize and build SQLite
        run: python ingest.py
      - name: Verify candidate publication
        run: python verify.py
      - name: Build static search
        env:
          LAW_FETCH: ${{ steps.fetch_law.outcome }}
          MFDS_FETCH: ${{ steps.fetch_mfds.outcome }}
        run: |
          export COLLECTION_STATUS="$(printf '{"run_at":"%s","law":"%s","mfds":"%s"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$LAW_FETCH" "$MFDS_FETCH")"
          python build_site.py
      # 게시 직전 최후 검사. 수집 성공/실패와 무관하게 실행되고, 비밀값이 저장·게시 자료(원본 메타, 정규화, MFDS,
      # 공개 DB, Pages 산출물) 어디에든 남았으면 job을 실패시켜 artifact 업로드·커밋·배포를 막는다.
      # continue-on-error 안에 두면 감지해도 게시가 진행된다.
      - name: Audit collected data for leaked secrets
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          DATA_GO_KEY: ${{ secrets.DATA_GO_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.parse
          from pathlib import Path
          secrets = [value for value in (os.environ.get("LAW_OC"), os.environ.get("DATA_GO_KEY")) if value]
          forms = {form for value in secrets for form in (value, urllib.parse.quote(value, safe=""), urllib.parse.quote_plus(value))}
          encoded = [form.encode("utf-8") for form in forms]
          paths = [Path("data/versions.json"), *Path("data/raw").glob("*/meta.json"),
                   *Path("data/normalized").glob("*.json"), *Path("data/mfds").glob("*.json"),
                   *Path("data/mfds/items").glob("*.json"), Path("data/criteria.db"),
                   *(path for path in Path("public").rglob("*") if path.is_file())]
          leaked = [path for path in paths if path.is_file() and any(form in path.read_bytes() for form in encoded)]
          if leaked:
              print("::error::비밀값이 저장 자료에 남았습니다: " + ", ".join(map(str, leaked[:10])))
              sys.exit(1)
          print(f"비밀값 누출 없음 ({len(paths)}개 파일 검사)")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: publication-candidate
          path: |
            data/raw
            data/normalized
            data/versions.json
            data/criteria.db
            data/mfds
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  publish-data:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: publication-candidate
          path: candidate
      - name: Promote canonical data and commit
        id: commit
        shell: bash
        run: |
          mkdir -p data/raw data/normalized data/mfds
          cp -a candidate/raw/. data/raw/
          cp -a candidate/normalized/. data/normalized/
          if [ -d candidate/mfds ]; then cp -a candidate/mfds/. data/mfds/; fi
          cp candidate/versions.json data/versions.json
          git add data/normalized
          if [ -d data/mfds/items ]; then git add data/mfds; fi
          git add -f data/versions.json data/raw/*/meta.json data/raw/*/[0-9][0-9][0-9]_*
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "RxCodeLab"
          git config user.email "40620480+RxCodeLab@users.noreply.github.com"
          git commit -m "급여기준 데이터 갱신"
          git push
          tag="data-${GITHUB_RUN_ID}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish downloadable SQLite snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.commit.outputs.tag }}
        run: |
          sha256sum candidate/criteria.db > candidate/criteria.db.sha256
          gh release create "$TAG" candidate/criteria.db candidate/criteria.db.sha256 --target "$(git rev-parse HEAD)" --title "$TAG" --notes "Verified automated drug-criteria snapshot."

  # 수집 실패는 런이 초록색으로 끝나므로 여기서 issue로 알린다. 같은 issue가 열려 있으면 본문을 최신 실패로 갱신한다.
  report-upstream:
    needs: build
    if: needs.build.outputs.law_fetch == 'failure' || needs.build.outputs.mfds_fetch == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report stale upstream data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LAW_FETCH: ${{ needs.build.outputs.law_fetch }}
          MFDS_FETCH: ${{ needs.build.outputs.mfds_fetch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          today="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          body="$(printf '%s\n' \
            "상위 데이터 수집이 실패해 검증된 기존 자료로 배포했습니다. 이번 실행의 신규분은 일부 반영되지 않았을 수 있습니다." \
            "" \
            "- 실행일(KST): $today" \
            "- 법제처 고시: $LAW_FETCH" \
            "- 식약처 허가정보: $MFDS_FETCH" \
            "- 로그: $RUN_URL")"
          echo "::warning::상위 데이터 수집이 실패해 검증된 기존 자료로 배포했습니다. 이번 실행의 신규분은 일부 반영되지 않았을 수 있습니다."
          { echo "## 상위 데이터 수집 실패"; echo; echo "$body"; } >> "$GITHUB_STEP_SUMMARY"
          gh label create upstream-failure --color d73a4a --description "상위 데이터 수집 실패" --force
          existing="$(gh issue list --label upstream-failure --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            # 장애가 길어지면 매일 댓글이 쌓여 알림 피로만 남는다. 열린 issue 본문을 최신 실패로 갱신한다.
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "[수집 실패] $today" --label upstream-failure --body "$body"
          fi

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified static search
        id: deployment
        uses: actions/deploy-pages@v5
